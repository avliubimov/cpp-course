name: Build and Deploy Course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ЭТАП 1: Проверка C++ кода
  test-cpp:
    name: Test C++ Labs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake and GCC
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Build and Test all labs
        run: |
          # Проходим по всем папкам в src/labs/
          for lab_dir in src/labs/*/; do
            if [ -f "$lab_dir/CMakeLists.txt" ]; then
              echo "=========================================="
              echo "Testing: $lab_dir"
              echo "=========================================="
              # Собираем в Release-режиме (чтобы проверить, что код оптимизируется)
              cmake -S "$lab_dir" -B "build_${lab_dir}" -DCMAKE_BUILD_TYPE=Release
              cmake --build "build_${lab_dir}"
              # Запускаем тесты с выводом ошибок, если они есть
              ctest --test-dir "build_${lab_dir}" --output-on-failure
            fi
          done

  # ЭТАП 2: Сборка сайта и генерация ZIP
  build-site:
    name: Build Hugo Site
    needs: test-cpp  # ВАЖНО: запускается ТОЛЬКО если test-cpp прошел успешно!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Generate ZIP archives for students
        run: |
          # Используем абсолютный путь — так надёжнее, не зависит от cd
          DOWNLOADS_DIR="$GITHUB_WORKSPACE/static/downloads"
          mkdir -p "$DOWNLOADS_DIR"

          for lab_dir in src/labs/*/; do
            if [ -d "$lab_dir" ]; then
              lab_name=$(basename "$lab_dir")
              echo "Creating ZIP for: $lab_name"
              # Заходим в папку лабы и архивируем её содержимое
              (cd "$lab_dir" && zip -r "$DOWNLOADS_DIR/${lab_name}.zip" .)
            fi
          done

          echo "Generated ZIP files:"
          ls -la "$DOWNLOADS_DIR"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ЭТАП 3: Деплой
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-site
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
